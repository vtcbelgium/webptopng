name: Deploy WebP & AVIF to PNG / JPG Converter to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: env.CF_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 8731d11f0dd513e9305c584846d8ceef
          command: pages deploy dist --project-name=webptopng --branch=main

      - name: Skip deploy (no Cloudflare token)
        if: env.CF_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret is not set; build and tests passed but nothing was deployed"
